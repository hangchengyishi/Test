// 维度定义
const dimensions = {
  execution:   {label:'执行力',    max:8},
  versatility: {label:'全能程度',  max:12},
  angst:       {label:'发刀指数',  max:12},
  weird:       {label:'变态程度',  max:14},
  money:       {label:'氪金力度',  max:12},
  social:      {label:'社交强度',  max:10},
  productivity:{label:'产出频率',  max:8},
  perfection:  {label:'完美主义',  max:6}
};

// 计算结果类型
function calcType(s, answers) {
  // 计算各维度百分比
  const pct = {};
  Object.keys(dimensions).forEach(k => {
    pct[k] = (s[k] / dimensions[k].max);
  });
  
  // 判断是否满足各类型条件
  const high = k => pct[k] >= 0.7;
  const mid = k => pct[k] >= 0.4 && pct[k] < 0.7;
  const low = k => pct[k] < 0.4;
  
  // 计数各类型倾向
  let scores = {
    IMNB: 0,  // 全能
    DEAD: 0,  // 死者
    SHIT: 0,  // 废物
    IMBT: 0,  // 变态
    CNY:  0,  // 土豪
    NM:   0,  // 牛马
    SUN:  0   // 太阳
  };
  
  // IMNB: 全能型 - 多技能且高产出
  if (high('versatility') && high('execution')) scores.IMNB += 3;
  if (high('versatility')) scores.IMNB += 2;
  if (high('productivity') && high('perfection')) scores.IMNB += 2;
  
  // DEAD: 死者 - 高刀子指数
  if (high('angst')) scores.DEAD += 3;
  if (mid('angst')) scores.DEAD += 1;
  
  // SHIT: 废物 - 低执行力+低产出
  if (low('execution') && low('productivity')) scores.SHIT += 3;
  if (low('execution')) scores.SHIT += 2;
  
  // IMBT: 变态 - 高变态指数
  if (high('weird')) scores.IMBT += 3;
  if (mid('weird')) scores.IMBT += 1;
  
  // CNY: 土豪 - 高金钱+可能低执行力(外包)
  if (high('money')) scores.CNY += 3;
  if (mid('money') && low('execution')) scores.CNY += 2;
  
  // NM: 牛马 - 高执行力但可能低全能+中等产出
  if (high('execution') && low('versatility')) scores.NM += 2;
  if (high('productivity') && !high('versatility')) scores.NM += 2;
  
  // SUN: 太阳 - 低社交+高持续性
  if (low('social') && high('productivity')) scores.SUN += 3;
  if (low('social') && mid('productivity')) scores.SUN += 2;
  if (pct.social < 0.2 && pct.productivity > 0.5) scores.SUN += 2;
  
  // 找到最高分
  let maxScore = 0;
  let resultType = 'NM';
  
  Object.entries(scores).forEach(([type, score]) => {
    if (score > maxScore) {
      maxScore = score;
      resultType = type;
    }
  });
  
  // 如果没有明显倾向，默认NM
  if (maxScore === 0) resultType = 'NM';
  
  // 返回结果详情
  const results = {
    IMNB: {
      name: 'IMNB · 八边形战士',

// 渲染题目
const form = document.getElementById('quiz-form');
const answers = {};
const multiAnswers = {};

questions.forEach(q => {
  const div = document.createElement('div');
  div.className = 'question';
  const meta = q.longText ? '情景题' : '维度已隐藏';
  let html = `<div class="q-header">第 ${q.n} 题 · ${meta}</div>`;
  html += q.longText ? `<div class="long-text">${q.text}</div>` : `<div class="q-text">${q.text}</div>`;
  html += `<div class="options">`;
  q.opts.forEach(o => {
    html += `<div class="option" data-q="${q.n}" data-opt="${o.k}">
      <span class="opt-letter">${o.k}</span><span>${o.t}</span>
    </div>`;
  });
  html += `</div>`;
  div.innerHTML = html;
  form.appendChild(div);
});

// 选项点击事件
document.querySelectorAll('.option').forEach(el => {
  el.addEventListener('click', () => {
    const q = el.dataset.q, o = el.dataset.opt;
    const question = questions.find(qs => qs.n == q);
    
    // 检查是否为变态题的多选逻辑
    if (q == '4') {
      if (!multiAnswers[q]) multiAnswers[q] = new Set();
      if (multiAnswers[q].has(o)) {
        multiAnswers[q].delete(o);
        el.classList.remove('selected');
      } else {
        multiAnswers[q].add(o);
        el.classList.add('selected');
      }
      // 保存最高分值
      let maxScore = 0;
      multiAnswers[q].forEach(opt => {
        const optData = question.opts.find(od => od.k === opt);
        if (optData && optData.s > maxScore) maxScore = optData.s;
      });
      answers[q] = { score: maxScore };
    } else {
      document.querySelectorAll(`.option[data-q="${q}"]`).forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      answers[q] = o;
    }
  });
});

// 提交按钮
document.getElementById('submit-btn').addEventListener('click', () => {
  const singleQs = questions.filter(q => q.n != 4).length;
  const answered = Object.keys(answers).filter(k => k != '4').length;
  if (answered < singleQs) {
    if (!confirm(`还有 ${singleQs - answered} 题没答，确定提交？`)) return;
  }

  // 计算分数
  const scores = {execution:0,versatility:0,angst:0,weird:0,money:0,social:0,productivity:0,perfection:0};
  questions.forEach(q => {
    if (!q.dim) return;
    const picked = answers[q.n];
    if (!picked) return;
    
    let opt;
    if (q.n == 4 && typeof picked === 'object') {
      // 变态题特殊处理
      scores[q.dim] += picked.score || 0;
      return;
    }
    
    opt = q.opts.find(o => o.k === picked);
    if (opt && typeof opt.s === 'number') scores[q.dim] += opt.s;
  });

  const result = calcType(scores, answers);

  // 显示结果
  document.getElementById('result-type').textContent = result.name;
  document.getElementById('result-desc').textContent = result.desc;
  document.getElementById('result-note').textContent = result.note;

  // 显示维度
  const dimBox = document.getElementById('dimensions');
  dimBox.innerHTML = '';
  Object.entries(dimensions).forEach(([key, def]) => {
    const pct = Math.round((scores[key] / def.max) * 100);
    dimBox.innerHTML += `
      <div class="dim-item">
        <div class="dim-label">${def.label}</div>
        <div class="dim-bar"><div class="dim-fill" data-pct="${pct}"></div></div>
        <div class="dim-score">${pct}%</div>
      </div>`;
  });

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});

  setTimeout(() => {
    document.querySelectorAll('.dim-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 100);
});

// 返回按钮
document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('result').classList.remove('active');
  document.getElementById('quiz').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});

// 分享按钮
document.getElementById('share-btn').addEventListener('click', () => {
  const resultType = document.getElementById('result-type').textContent;
  const text = `我在OCTI测试中获得了【${resultType}】的结果！快来测测你是哪种造物主吧~`;
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('结果已复制到剪贴板！');
    });
  } else {
    alert(text);
  }
});
